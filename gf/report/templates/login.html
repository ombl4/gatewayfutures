{% extends "base.html" %}
{% set page='login' %}
{% block title %}Sign in · Call simulator{% endblock %}
{% block crumbs %}<b>Sign in</b>{% endblock %}
{% block content %}
<h1>Sign in</h1>
<p class="sub">This instance is protected with an access token.</p>
<form method="post" action="/login" class="card" style="max-width:420px">
  <input type="hidden" name="next" value="{{ next }}">
  <label class="small muted">Access token</label>
  <input type="password" name="token" class="input" autofocus>
  {% if error %}<p style="color:var(--red)">{{ error }}</p>{% endif %}
  <button type="submit" class="btn primary">Sign in</button>
</form>
{% endblock %}
