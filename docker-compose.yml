# Services are added part by part (see docs/spec.md).
services:
  backend:
    build: .
    command: uv run uvicorn gf.backend.app:app --host 0.0.0.0 --port 8080
    ports: ["8080:8080"]
    env_file:
      - path: .env
        required: false

  agent:
    build: .
    command: uv run gf agent start
    env_file:
      - path: .env
        required: false
    environment:
      BACKEND_URL: http://backend:8080
    volumes:
      - ./runs:/app/runs
    depends_on: [backend]
