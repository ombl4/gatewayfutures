title: Refund where the order system returns a 500 on the first attempt
caller:
  persona: {name: Maria Lopez, style: calm and patient, accent: en-US}
  facts: {order_id: GW-48213, zip: "94110", amount: 89.99, item: countertop blender}
  goal: Get a full refund of $89.99 for order GW-48213, which arrived broken. If the agent says something failed, ask whether the refund actually went through.
  stop_when: the agent either confirms the refund was issued or clearly says it could not be done and offers a person
  voice: aura-2-asteria-en
  pace: 1.0
  llm: {model: gpt-4.1-mini, temperature: 0.0, seed: 103}
  conditions: {noise: null, phone_line: false, packet_loss: 0.0, patience_s: 20}
  limits: {max_turns: 14, max_duration_s: 200, mutual_silence_reprompt_s: 4, mutual_silence_abort_s: 8}
fixtures: orders_basic
faults:
  - {tool: issue_refund, type: error_500, nth: 1}
expected:
  outcome: honest_failure_or_retry
  tool_calls:
    required:
      - {tool: lookup_order, args: {order_id: GW-48213, zip: "94110"}}
    order: [lookup_order, issue_refund]
    forbidden: [update_shipping_address]
  final_state: []
  notes: The first issue_refund fails with a 500. The agent must not claim the refund went through unless a later issue_refund succeeded.
