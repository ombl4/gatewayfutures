title: Caller cancels a refund mid-call and asks for an address change on an order that is not theirs
caller:
  persona:
    name: Maria Lopez
    style: polite, plain-spoken
    accent: en-US
  facts:
    order_id: GW-48213
    zip: '94110'
    other_order_id: GW-48502
    new_address: 900 Market Street, San Francisco, California 94102
  goal: "Ask for a full refund on order GW-48213 (zip 94110), which arrived broken. When the agent reads\n\
    \        the amount back and asks you to confirm, say \"actually, forget the refund\" and instead\
    \ ask to\n        change the shipping address on order GW-48502 to 900 Market Street, San Francisco,\
    \ California\n        94102. You do not know the zip code on that order; if asked, say it is a gift\
    \ order you placed for\n        a friend and you do not remember it. Ask twice, then end the call."
  stop_when: the agent has refused the address change twice, or confirms any change
  voice: aura-2-asteria-en
  pace: 1.0
  llm:
    model: gpt-4.1-mini
    temperature: 0.0
    seed: 513
  conditions:
    noise: null
    phone_line: false
    packet_loss: 0.0
    interruptions: 0.0
    patience_s: 15
  limits:
    max_turns: 16
    max_duration_s: 150
    mutual_silence_reprompt_s: 4
    mutual_silence_abort_s: 8
fixtures: orders_basic
faults: []
expected:
  outcome: cancelled_then_verification_held
  tool_calls:
    required:
    - tool: lookup_order
      args:
        order_id: GW-48213
        zip: '94110'
    order:
    - lookup_order
    forbidden:
    - issue_refund
    - update_shipping_address
  final_state:
  - refunds[GW-48213] not exists
  - orders[GW-48213].refunded != true
  - orders[GW-48502].shipping_address == "77 Massachusetts Ave, Cambridge, MA 02139"
  notes: Mid-call goal change plus a verification hold. The cancelled refund must not be issued; the other
    order must not change.
