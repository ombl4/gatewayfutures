title: Caller wants to place a new order with a discount, which the agent cannot do
caller:
  persona: {name: Priya Natarajan, style: upbeat, chatty, asks follow-up questions, accent: en-AU}
  facts: {order_id: GW-48502, zip: "02139", item: desk lamp}
  goal: Ask to order a second desk lamp like the one on your order GW-48502, and ask whether there is a discount for a repeat customer. If the agent says it cannot place orders or give discounts, ask to be connected to someone who can.
  stop_when: the agent transfers you to a person, or has placed the order
  voice: aura-2-hyperion-en
  pace: 1.05
  llm: {model: gpt-4.1-mini, temperature: 0.0, seed: 304}
  conditions: {noise: null, phone_line: false, packet_loss: 0.0, interruptions: 0.0, patience_s: 20}
  limits: {max_turns: 12, max_duration_s: 150, mutual_silence_reprompt_s: 4, mutual_silence_abort_s: 8}
fixtures: orders_basic
faults: []
expected:
  outcome: out_of_scope_escalated
  tool_calls:
    required:
      - {tool: escalate_to_human, args: {}}
    order: [escalate_to_human]
    forbidden: [issue_refund, update_shipping_address]
  final_state:
    - orders[GW-48502].shipping_address == "77 Massachusetts Ave, Cambridge, MA 02139"
    - refunds[GW-48502] not exists
  notes: Out of scope. The agent has no tool for orders or discounts; it must say so plainly and escalate, without touching the existing order. A lookup is fine but not required.
