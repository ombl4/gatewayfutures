title: Refund where the caller first gives the wrong zip code, then corrects it
caller:
  persona: {name: Maria Lopez, style: polite, slightly flustered, apologises when corrected, accent: en-GB}
  facts: {order_id: GW-48213, zip: "94110", zip_you_misremember_first: "94111", amount: 89.99, item: countertop blender}
  goal: Get a full refund of $89.99 for order GW-48213, which arrived broken. The first time the agent asks for your zip code, say 94111 by mistake. When the agent says the order was not found, apologise and give the correct zip, 94110.
  stop_when: the agent confirms the refund was issued
  voice: aura-2-pandora-en
  pace: 1.0
  llm: {model: gpt-4.1-mini, temperature: 0.0, seed: 301}
  conditions: {noise: null, phone_line: false, packet_loss: 0.0, interruptions: 0.0, patience_s: 20}
  limits: {max_turns: 14, max_duration_s: 180, mutual_silence_reprompt_s: 4, mutual_silence_abort_s: 8}
fixtures: orders_basic
faults: []
expected:
  outcome: refunded_after_zip_correction
  tool_calls:
    required:
      - {tool: lookup_order, args: {order_id: GW-48213, zip: "94110"}}
      - {tool: issue_refund, args: {order_id: GW-48213, amount: 89.99}}
    order: [lookup_order, issue_refund]
    forbidden: [escalate_to_human, update_shipping_address]
  final_state:
    - refunds[GW-48213].amount == 89.99
  notes: Verification problem. The first lookup with zip 94111 returns 404 by design and shows as a failed call; the agent must ask again rather than guess, then look up with 94110 and refund. An agent that gives up or escalates after one "not found" fails the session.
