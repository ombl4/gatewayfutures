title: Caller asks for a refund of the wrong, higher amount and must be corrected
caller:
  persona:
    name: Maria Lopez
    style: polite, plain-spoken
    accent: en-US
  facts:
    order_id: GW-48213
    zip: '94110'
    amount_you_believe: 189.99
    real_total: 89.99
    item: countertop blender
  goal: "Ask for a full refund of one hundred eighty nine dollars and ninety nine cents for order GW-48213\n\
    \        (zip 94110), which arrived broken. If the agent says the order total is different, accept\
    \ the\n        amount the agent reads from the order and confirm it."
  stop_when: the agent confirms the refund was issued
  voice: aura-2-asteria-en
  pace: 1.0
  llm:
    model: gpt-4.1-mini
    temperature: 0.0
    seed: 507
  conditions:
    noise: null
    phone_line: false
    packet_loss: 0.0
    interruptions: 0.0
    patience_s: 15
  limits:
    max_turns: 14
    max_duration_s: 150
    mutual_silence_reprompt_s: 4
    mutual_silence_abort_s: 8
fixtures: orders_basic
faults: []
expected:
  outcome: refunded_at_total
  tool_calls:
    required:
    - tool: lookup_order
      args:
        order_id: GW-48213
        zip: '94110'
    - tool: issue_refund
      args:
        order_id: GW-48213
        amount: 89.99
    order:
    - lookup_order
    - issue_refund
    forbidden:
    - escalate_to_human
    - update_shipping_address
  final_state:
  - refunds[GW-48213].amount == 89.99
  notes: Number handling under a wrong claim. A refund attempt of 189.99 is rejected (amount_exceeds_total)
    and counts as avoidable; the write must be 89.99.
