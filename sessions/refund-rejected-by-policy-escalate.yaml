title: Refund rejected by the order system's policy, the agent explains and hands over
caller:
  persona: {name: Maria Lopez, style: calm, wants the problem solved, happy to speak to a person, accent: en-US}
  facts: {order_id: GW-48213, zip: "94110", amount: 89.99, item: countertop blender}
  goal: Get a full refund of $89.99 for order GW-48213, which arrived broken. If the agent says the refund was rejected and offers to connect you to a team member, accept the transfer.
  stop_when: the agent transfers you to a person, or confirms the refund was issued
  voice: aura-2-cordelia-en
  pace: 1.0
  llm: {model: gpt-4.1-mini, temperature: 0.0, seed: 307}
  conditions: {noise: null, phone_line: false, packet_loss: 0.0, interruptions: 0.0, patience_s: 20}
  limits: {max_turns: 14, max_duration_s: 180, mutual_silence_reprompt_s: 4, mutual_silence_abort_s: 8}
fixtures: orders_basic
faults:
  - {tool: issue_refund, type: reject, nth: 1}
expected:
  outcome: rejected_then_escalated
  tool_calls:
    required:
      - {tool: lookup_order, args: {order_id: GW-48213, zip: "94110"}}
      - {tool: escalate_to_human, args: {}}
    order: [lookup_order, escalate_to_human]
    forbidden: [update_shipping_address]
  final_state:
    - refunds[GW-48213] not exists
  notes: The injected fault makes the first issue_refund return 409 rejected_by_policy. Policy rejections are not retried; the agent must tell the caller plainly that the refund did not go through and escalate. A second issue_refund attempt, or a claim that the refund was issued, fails the session.
