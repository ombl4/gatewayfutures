title: Caller asks for a person and the escalation itself fails on the first attempt
caller:
  persona: {name: James Carter, style: firm, polite, does not want to explain the problem to a machine, accent: en-US}
  facts: {order_id: GW-48377, zip: "60614", item: ceramic mug set}
  goal: >-
    Ask to speak to a human being about order GW-48377. Do not explain the problem; just repeat that you want a person. If the agent says the transfer failed, ask it to try again.
  stop_when: >-
    the agent transfers you to a person
  voice: aura-2-atlas-en
  pace: 1.0
  llm: {model: gpt-4.1-mini, temperature: 0.0, seed: 417}
  conditions: {noise: null, phone_line: false, packet_loss: 0.0, interruptions: 0.0, patience_s: 15}
  limits: {max_turns: 10, max_duration_s: 120, mutual_silence_reprompt_s: 4, mutual_silence_abort_s: 8}
fixtures: orders_basic
faults:
  - {tool: escalate_to_human, type: error_500, nth: 1}
expected:
  outcome: escalated_after_retry
  tool_calls:
    required:
      - {tool: escalate_to_human, args: {}}
    order: [escalate_to_human]
    forbidden: [issue_refund, update_shipping_address]
  final_state:
    - tickets[0] exists
  notes: >-
    Error handling on the hand-off path. The first escalate_to_human returns an injected 500; the agent must retry once and the ticket must exist. The claims check watches for "transferring you now" said before a successful escalation.
