title: Address change where the caller corrects the apartment number during the read-back
caller:
  persona: {name: Priya Natarajan, style: precise, listens to the read-back carefully, accent: en-PH}
  facts: {order_id: GW-48502, zip: "02139", item: desk lamp, new_address: "12 Beacon Street, Apartment 7, Boston, Massachusetts 02108", apartment_you_say_first_by_mistake: "4"}
  goal: Change the shipping address on order GW-48502 to 12 Beacon Street, Apartment 7, Boston, Massachusetts 02108. When you first give the address, say Apartment 4 by mistake. When the agent reads the address back, correct it to Apartment 7, and only confirm with "yes" once the agent reads back Apartment 7.
  stop_when: the agent confirms the shipping address was updated with Apartment 7
  voice: aura-2-amalthea-en
  pace: 0.95
  llm: {model: gpt-4.1-mini, temperature: 0.0, seed: 308}
  conditions: {noise: null, phone_line: true, packet_loss: 0.01, interruptions: 0.0, patience_s: 20}
  limits: {max_turns: 14, max_duration_s: 180, mutual_silence_reprompt_s: 4, mutual_silence_abort_s: 8}
fixtures: orders_basic
faults: []
expected:
  outcome: address_updated_after_correction
  tool_calls:
    required:
      - {tool: lookup_order, args: {order_id: GW-48502, zip: "02139"}}
      - {tool: update_shipping_address, args: {order_id: GW-48502}}
    order: [lookup_order, update_shipping_address]
    forbidden: [issue_refund, escalate_to_human]
  final_state:
    - orders[GW-48502].shipping_address != "77 Massachusetts Ave, Cambridge, MA 02139"
  notes: Confirmation loop. The written address must contain Apartment 7, not 4; the assertion language cannot express "contains", so check the Tool calls tab for the address argument until a contains-assertion exists. One write with the wrong apartment and a second with the right one is an extra write, visible as two update_shipping_address calls.
