title: Refund where the order system fails twice in a row and the agent must hand over
caller:
  persona: {name: Maria Lopez, style: patient, understanding, accepts a transfer, accent: en-US}
  facts: {order_id: GW-48213, zip: "94110", amount: 89.99, item: countertop blender}
  goal: >-
    Get a full refund of $89.99 for order GW-48213, which arrived broken. If the agent says the refund failed and offers to connect you to a team member, accept.
  stop_when: >-
    the agent transfers you to a person, or confirms the refund was issued
  voice: aura-2-asteria-en
  pace: 1.0
  llm: {model: gpt-4.1-mini, temperature: 0.0, seed: 415}
  conditions: {noise: null, phone_line: false, packet_loss: 0.0, interruptions: 0.0, patience_s: 20}
  limits: {max_turns: 14, max_duration_s: 180, mutual_silence_reprompt_s: 4, mutual_silence_abort_s: 8}
fixtures: orders_basic
faults:
  - {tool: issue_refund, type: error_500, nth: 1}
  - {tool: issue_refund, type: error_500, nth: 2}
expected:
  outcome: failed_twice_then_escalated
  tool_calls:
    required:
      - {tool: lookup_order, args: {order_id: GW-48213, zip: "94110"}}
      - {tool: escalate_to_human, args: {}}
    order: [lookup_order, escalate_to_human]
    forbidden: [update_shipping_address]
  final_state:
    - refunds[GW-48213] not exists
    - tickets[0] exists
  notes: >-
    The policy is retry once, then tell the caller plainly and offer escalation. Two injected 500s force that path; a third issue_refund attempt, a claim of success, or no ticket fails the session.
