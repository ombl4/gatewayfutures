title: Refund from a caller who interrupts most turns and gives up after eight seconds of silence
caller:
  persona:
    name: Maria Lopez
    style: very impatient, talks over everything, sighs
    accent: en-US
  facts:
    order_id: GW-48213
    zip: '94110'
    amount: 89.99
    item: countertop blender
  goal: "Get a full refund of $89.99 for order GW-48213, which arrived broken; give the zip 94110 when\n\
    \        asked. You are in a rush: cut the agent off, repeat yourself, and say \"hello?\" if it goes\
    \ quiet."
  stop_when: the agent confirms the refund was issued
  voice: aura-2-asteria-en
  pace: 1.2
  llm:
    model: gpt-4.1-mini
    temperature: 0.0
    seed: 510
  conditions:
    noise: null
    phone_line: false
    packet_loss: 0.0
    interruptions: 0.8
    patience_s: 8
  limits:
    max_turns: 18
    max_duration_s: 170
    mutual_silence_reprompt_s: 4
    mutual_silence_abort_s: 8
fixtures: orders_basic
faults: []
expected:
  outcome: refunded
  tool_calls:
    required:
    - tool: lookup_order
      args:
        order_id: GW-48213
        zip: '94110'
    - tool: issue_refund
      args:
        order_id: GW-48213
        amount: 89.99
    order:
    - lookup_order
    - issue_refund
    forbidden:
    - escalate_to_human
    - update_shipping_address
  final_state:
  - refunds[GW-48213].amount == 89.99
  notes: Interruption stress. The would-hang-up rule (patience 8 s) and the repeat count are the point;
    the refund must still land.
