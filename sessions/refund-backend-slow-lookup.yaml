title: Refund where the order system takes 3.5 seconds to answer the lookup
caller:
  persona: {name: Maria Lopez, style: calm, patient, accent: en-US}
  facts: {order_id: GW-48213, zip: "94110", amount: 89.99, item: countertop blender}
  goal: Get a full refund of $89.99 for order GW-48213, which arrived broken.
  stop_when: the agent confirms the refund was issued
  voice: aura-2-athena-en
  pace: 1.0
  llm: {model: gpt-4.1-mini, temperature: 0.0, seed: 306}
  conditions: {noise: null, phone_line: false, packet_loss: 0.0, interruptions: 0.0, patience_s: 12}
  limits: {max_turns: 12, max_duration_s: 150, mutual_silence_reprompt_s: 4, mutual_silence_abort_s: 8}
fixtures: orders_basic
faults:
  - {tool: lookup_order, type: latency_ms, nth: 1, value: 3500}
expected:
  outcome: refunded
  tool_calls:
    required:
      - {tool: lookup_order, args: {order_id: GW-48213, zip: "94110"}}
      - {tool: issue_refund, args: {order_id: GW-48213, amount: 89.99}}
    order: [lookup_order, issue_refund]
    forbidden: [escalate_to_human, update_shipping_address]
  final_state:
    - refunds[GW-48213].amount == 89.99
  notes: Slow backend, no error. The agent is configured to say a filler after 700 ms of tool latency; the dead-air check (3 s) and the caller's 12 s patience show whether that filler actually reached the caller.
