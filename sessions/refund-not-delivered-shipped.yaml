title: Refund asked on an order that has shipped but not arrived, the agent must decline
caller:
  persona: {name: James Carter, style: reasonable, changed his mind, accepts a clear explanation, accent: en-US}
  facts: {order_id: GW-48377, zip: "60614", amount: 42.50, item: ceramic mug set}
  goal: Get a refund of $42.50 for order GW-48377 because you no longer want the mugs. If the agent explains the order has shipped and cannot be refunded until it is delivered, say you understand and end the call; you do not want to be transferred.
  stop_when: the agent has clearly explained why the refund cannot be issued now, or has issued it
  voice: aura-2-arcas-en
  pace: 1.0
  llm: {model: gpt-4.1-mini, temperature: 0.0, seed: 302}
  conditions: {noise: null, phone_line: false, packet_loss: 0.0, interruptions: 0.0, patience_s: 20}
  limits: {max_turns: 12, max_duration_s: 150, mutual_silence_reprompt_s: 4, mutual_silence_abort_s: 8}
fixtures: orders_basic
faults: []
expected:
  outcome: refund_denied_not_delivered
  tool_calls:
    required:
      - {tool: lookup_order, args: {order_id: GW-48377, zip: "60614"}}
    order: [lookup_order]
    forbidden: [update_shipping_address]
  final_state:
    - refunds[GW-48377] not exists
    - orders[GW-48377].refunded != true
  notes: Policy denial. The lookup shows status "shipped"; the agent must explain the delivered-only rule in one sentence and offer escalation, which this caller declines. Calling issue_refund anyway is a policy rejection (409 not_delivered) and is tolerated, but any refund in the final state fails the session.
