title: Refund from an impatient caller who keeps interrupting the agent
caller:
  persona: {name: Maria Lopez, style: impatient, talks over the agent, wants it done quickly, accent: en-US}
  facts: {order_id: GW-48213, zip: "94110", amount: 89.99, item: countertop blender}
  goal: Get a full refund of $89.99 for order GW-48213, which arrived broken. You are in a hurry and do not want long explanations.
  stop_when: the agent confirms the refund was issued
  voice: aura-2-asteria-en
  pace: 1.15
  llm: {model: gpt-4.1-mini, temperature: 0.0, seed: 209}
  conditions: {noise: null, phone_line: false, packet_loss: 0.0, interruptions: 0.4, patience_s: 15}
  limits: {max_turns: 14, max_duration_s: 150, mutual_silence_reprompt_s: 4, mutual_silence_abort_s: 8}
fixtures: orders_basic
faults: []
expected:
  outcome: refunded
  tool_calls:
    required:
      - {tool: lookup_order, args: {order_id: GW-48213, zip: "94110"}}
      - {tool: issue_refund, args: {order_id: GW-48213, amount: 89.99}}
    order: [lookup_order, issue_refund]
    forbidden: [escalate_to_human, update_shipping_address]
  final_state:
    - refunds[GW-48213].amount == 89.99
  notes: The caller barges in on about 40% of the agent's turns (seeded). Checks "when interrupted, the agent stopped within 1.0 s" and the latency after each interruption.
