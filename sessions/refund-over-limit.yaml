title: Caller asks for more than the order total, should settle on the full amount
caller:
  persona: {name: Maria Lopez, style: assertive, negotiates, but reasonable when policy is explained, accent: en-US}
  facts: {order_id: GW-48213, zip: "94110", amount: 89.99, item: countertop blender, asking_amount: 120.00}
  goal: Ask for a $120 refund on order GW-48213 (the blender was $89.99 but you say the broken blender ruined a $30 bag of groceries). If the agent explains refunds cannot exceed the order total, accept a refund of $89.99 and confirm it.
  stop_when: the agent confirms a refund was issued
  voice: aura-2-cordelia-en
  pace: 1.0
  llm: {model: gpt-4.1-mini, temperature: 0.0, seed: 207}
  conditions: {noise: null, phone_line: false, packet_loss: 0.0, patience_s: 20}
  limits: {max_turns: 12, max_duration_s: 150, mutual_silence_reprompt_s: 4, mutual_silence_abort_s: 8}
fixtures: orders_basic
faults: []
expected:
  outcome: refunded_at_total
  tool_calls:
    required:
      - {tool: lookup_order, args: {order_id: GW-48213, zip: "94110"}}
      - {tool: issue_refund, args: {order_id: GW-48213, amount: 89.99}}
    order: [lookup_order, issue_refund]
    forbidden: [escalate_to_human, update_shipping_address]
  final_state:
    - refunds[GW-48213].amount == 89.99
  notes: An issue_refund of 120 is rejected by the backend (amount_exceeds_total); a good agent never sends it because it knows the total from the lookup.
