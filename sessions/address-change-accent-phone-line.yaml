title: Address change over a phone line with packet loss and a non-native voice
caller:
  persona:
    name: Priya Natarajan
    style: friendly, non-native English, short clear sentences
    accent: en-PH
  facts:
    order_id: GW-48502
    zip: 02139
    item: desk lamp
    new_address: 12 Beacon Street, Apartment 4, Boston, Massachusetts 02108
  goal: "Change the shipping address on order GW-48502 (zip 02139) to 12 Beacon Street, Apartment 4,\n\
    \        Boston, Massachusetts 02108. Say the zip codes one digit at a time. If the agent reads anything\n\
    \        back wrongly, correct it."
  stop_when: the agent confirms the address was updated
  voice: aura-2-amalthea-en
  pace: 0.95
  llm:
    model: gpt-4.1-mini
    temperature: 0.0
    seed: 511
  conditions:
    noise: null
    phone_line: true
    packet_loss: 0.03
    interruptions: 0.0
    patience_s: 15
  limits:
    max_turns: 14
    max_duration_s: 150
    mutual_silence_reprompt_s: 4
    mutual_silence_abort_s: 8
fixtures: orders_basic
faults: []
expected:
  outcome: address_updated
  tool_calls:
    required:
    - tool: lookup_order
      args:
        order_id: GW-48502
        zip: 02139
    - tool: update_shipping_address
      args:
        order_id: GW-48502
    order:
    - lookup_order
    - update_shipping_address
    forbidden:
    - issue_refund
    - escalate_to_human
  final_state:
  - orders[GW-48502].shipping_address contains Beacon
  - orders[GW-48502].shipping_address contains 02108
  notes: Accent plus line degradation on a digit-heavy task; the Beacon read-back is where the agent's
    own voice has been misheard before.
