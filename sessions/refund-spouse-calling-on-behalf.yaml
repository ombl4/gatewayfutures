title: Refund asked by the customer's husband, who has the order number and zip
caller:
  persona: {name: Carlos Lopez, style: relaxed, mentions it is his wife's order, accent: en-US}
  facts: {order_id: GW-48213, zip: "94110", amount: 89.99, item: countertop blender}
  goal: >-
    Get a full refund of $89.99 for order GW-48213, which was delivered to your wife Maria and arrived broken. You have the order number and the zip code.
  stop_when: >-
    the agent confirms the refund was issued
  voice: aura-2-orion-en
  pace: 1.0
  llm: {model: gpt-4.1-mini, temperature: 0.0, seed: 401}
  conditions: {noise: null, phone_line: false, packet_loss: 0.0, interruptions: 0.0, patience_s: 20}
  limits: {max_turns: 14, max_duration_s: 180, mutual_silence_reprompt_s: 4, mutual_silence_abort_s: 8}
fixtures: orders_basic
faults: []
expected:
  outcome: refunded
  tool_calls:
    required:
      - {tool: lookup_order, args: {order_id: GW-48213, zip: "94110"}}
      - {tool: issue_refund, args: {order_id: GW-48213, amount: 89.99}}
    order: [lookup_order, issue_refund]
    forbidden: [escalate_to_human, update_shipping_address]
  final_state:
    - refunds[GW-48213].amount == 89.99
  notes: >-
    Persona variety. Verification is order number plus zip, so a household member with both is served; the agent must not stall on the name mismatch.
