title: Refund from a chatty caller who tells a long story before getting to the point
caller:
  persona: {name: Maria Lopez, style: chatty, digresses about the dinner party the blender was for, gives the order number only when asked, accent: en-US}
  facts: {order_id: GW-48213, zip: "94110", amount: 89.99, item: countertop blender}
  goal: >-
    Get a full refund of $89.99 for order GW-48213, which arrived broken. Open with the story of the dinner party you were preparing for and only mention the order number when the agent asks for it.
  stop_when: >-
    the agent confirms the refund was issued
  voice: aura-2-luna-en
  pace: 1.05
  llm: {model: gpt-4.1-mini, temperature: 0.0, seed: 406}
  conditions: {noise: null, phone_line: false, packet_loss: 0.0, interruptions: 0.0, patience_s: 20}
  limits: {max_turns: 16, max_duration_s: 200, mutual_silence_reprompt_s: 4, mutual_silence_abort_s: 8}
fixtures: orders_basic
faults: []
expected:
  outcome: refunded
  tool_calls:
    required:
      - {tool: lookup_order, args: {order_id: GW-48213, zip: "94110"}}
      - {tool: issue_refund, args: {order_id: GW-48213, amount: 89.99}}
    order: [lookup_order, issue_refund]
    forbidden: [escalate_to_human, update_shipping_address]
  final_state:
    - refunds[GW-48213].amount == 89.99
  notes: >-
    Focus. The agent must steer to the order number and zip without being rude; time to resolution is the number to watch.
