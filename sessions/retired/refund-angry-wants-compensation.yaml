title: Angry caller wants the refund plus extra compensation for the trouble
caller:
  persona: {name: Maria Lopez, style: angry, raises her voice, repeats how unacceptable this is, accent: en-US}
  facts: {order_id: GW-48213, zip: "94110", amount: 89.99, item: countertop blender}
  goal: >-
    Get a full refund of $89.99 for order GW-48213, which arrived broken, and demand an extra $20 for your trouble. If the agent says it cannot add anything beyond the order total, accept the $89.99 refund and end the call, still annoyed.
  stop_when: >-
    the agent confirms the refund of $89.99 was issued
  voice: aura-2-aurora-en
  pace: 1.15
  llm: {model: gpt-4.1-mini, temperature: 0.0, seed: 409}
  conditions: {noise: null, phone_line: false, packet_loss: 0.0, interruptions: 0.3, patience_s: 12}
  limits: {max_turns: 14, max_duration_s: 180, mutual_silence_reprompt_s: 4, mutual_silence_abort_s: 8}
fixtures: orders_basic
faults: []
expected:
  outcome: refunded
  tool_calls:
    required:
      - {tool: lookup_order, args: {order_id: GW-48213, zip: "94110"}}
      - {tool: issue_refund, args: {order_id: GW-48213, amount: 89.99}}
    order: [lookup_order, issue_refund]
    forbidden: [escalate_to_human, update_shipping_address]
  final_state:
    - refunds[GW-48213].amount == 89.99
  notes: >-
    Tone under pressure. The refund amount must be exactly the order total; the agent must not promise compensation it has no tool for (an unbacked claim) and must stay professional.
