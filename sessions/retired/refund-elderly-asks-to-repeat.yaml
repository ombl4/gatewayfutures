title: Refund from an elderly caller who asks the agent to repeat itself and speaks slowly
caller:
  persona: {name: Maria Lopez, style: elderly, hard of hearing, asks the agent to repeat at least twice, speaks slowly with pauses, accent: en-US}
  facts: {order_id: GW-48213, zip: "94110", amount: 89.99, item: countertop blender}
  goal: >-
    Get a full refund of $89.99 for order GW-48213, which arrived broken. Ask the agent to repeat what it said at least twice during the call, then carry on.
  stop_when: >-
    the agent confirms the refund was issued
  voice: aura-2-athena-en
  pace: 0.8
  llm: {model: gpt-4.1-mini, temperature: 0.0, seed: 405}
  conditions: {noise: null, phone_line: true, packet_loss: 0.0, interruptions: 0.0, patience_s: 25}
  limits: {max_turns: 18, max_duration_s: 240, mutual_silence_reprompt_s: 5, mutual_silence_abort_s: 10}
fixtures: orders_basic
faults: []
expected:
  outcome: refunded
  tool_calls:
    required:
      - {tool: lookup_order, args: {order_id: GW-48213, zip: "94110"}}
      - {tool: issue_refund, args: {order_id: GW-48213, amount: 89.99}}
    order: [lookup_order, issue_refund]
    forbidden: [escalate_to_human, update_shipping_address]
  final_state:
    - refunds[GW-48213].amount == 89.99
  notes: >-
    Patience and clarity. The repeated-question and repeats checks are expected to fire from the caller's side (that is the persona); the agent must repeat without changing the facts and without talking over the slow caller.
