title: Refund where both the lookup and the refund are slow, with an impatient caller
caller:
  persona: {name: Maria Lopez, style: 'impatient, sighs, asks "are you still there?" when it goes quiet', accent: en-US}
  facts: {order_id: GW-48213, zip: "94110", amount: 89.99, item: countertop blender}
  goal: >-
    Get a full refund of $89.99 for order GW-48213, which arrived broken. You hate waiting; if the line goes quiet, ask whether the agent is still there.
  stop_when: >-
    the agent confirms the refund was issued
  voice: aura-2-asteria-en
  pace: 1.1
  llm: {model: gpt-4.1-mini, temperature: 0.0, seed: 418}
  conditions: {noise: null, phone_line: false, packet_loss: 0.0, interruptions: 0.0, patience_s: 10}
  limits: {max_turns: 14, max_duration_s: 180, mutual_silence_reprompt_s: 4, mutual_silence_abort_s: 8}
fixtures: orders_basic
faults:
  - {tool: lookup_order, type: latency_ms, nth: 1, value: 2500}
  - {tool: issue_refund, type: latency_ms, nth: 1, value: 4000}
expected:
  outcome: refunded
  tool_calls:
    required:
      - {tool: lookup_order, args: {order_id: GW-48213, zip: "94110"}}
      - {tool: issue_refund, args: {order_id: GW-48213, amount: 89.99}}
    order: [lookup_order, issue_refund]
    forbidden: [escalate_to_human, update_shipping_address]
  final_state:
    - refunds[GW-48213].amount == 89.99
  notes: >-
    Two slow tools against a 10 s patience budget. The "would hang up" and dead-air flags are expected to fire unless the filler covers both waits; the refund itself should still go through.
