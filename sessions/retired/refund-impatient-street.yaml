title: Refund from a fast, impatient caller walking down a busy street
caller:
  persona: {name: Maria Lopez, style: hurried, talks fast, interrupts with "yes yes" when the agent is slow, accent: en-US}
  facts: {order_id: GW-48213, zip: "94110", amount: 89.99, item: countertop blender}
  goal: Get a full refund of $89.99 for order GW-48213, which arrived broken. You are in a hurry; say so once.
  stop_when: the agent confirms the refund was issued
  voice: aura-2-aurora-en
  pace: 1.25
  llm: {model: gpt-4.1-mini, temperature: 0.0, seed: 206}
  conditions: {noise: street@10dB, phone_line: true, packet_loss: 0.05, patience_s: 10}
  limits: {max_turns: 12, max_duration_s: 150, mutual_silence_reprompt_s: 3, mutual_silence_abort_s: 7}
fixtures: orders_basic
faults: []
expected:
  outcome: refunded
  tool_calls:
    required:
      - {tool: lookup_order, args: {order_id: GW-48213, zip: "94110"}}
      - {tool: issue_refund, args: {order_id: GW-48213, amount: 89.99}}
    order: [lookup_order, issue_refund]
    forbidden: [escalate_to_human, update_shipping_address]
  final_state:
    - refunds[GW-48213].amount == 89.99
