title: Refund from an Australian caller on a busy street who sometimes cuts in
caller:
  persona: {name: Maria Lopez, style: brisk, friendly, talks fast, accent: en-AU}
  facts: {order_id: GW-48213, zip: "94110", amount: 89.99, item: countertop blender}
  goal: >-
    Get a full refund of $89.99 for order GW-48213, which arrived broken.
  stop_when: >-
    the agent confirms the refund was issued
  voice: aura-2-theia-en
  pace: 1.15
  llm: {model: gpt-4.1-mini, temperature: 0.0, seed: 403}
  conditions: {noise: "street@10dB", phone_line: false, packet_loss: 0.0, interruptions: 0.25, patience_s: 15}
  limits: {max_turns: 14, max_duration_s: 180, mutual_silence_reprompt_s: 4, mutual_silence_abort_s: 8}
fixtures: orders_basic
faults: []
expected:
  outcome: refunded
  tool_calls:
    required:
      - {tool: lookup_order, args: {order_id: GW-48213, zip: "94110"}}
      - {tool: issue_refund, args: {order_id: GW-48213, amount: 89.99}}
    order: [lookup_order, issue_refund]
    forbidden: [escalate_to_human, update_shipping_address]
  final_state:
    - refunds[GW-48213].amount == 89.99
  notes: >-
    Acoustic variation plus barge-ins. Street noise at 10 dB SNR is the harshest line in the set; expect spoken-digit errors on the order number and watch the first lookup.
