title: Address change over a narrow phone line, calm British caller
caller:
  persona: {name: Priya Natarajan, style: calm, precise, spells the street name if asked, accent: en-GB}
  facts: {order_id: GW-48502, zip: "02139", item: desk lamp, new_address: "9 Harvard Square, Cambridge, Massachusetts 02138"}
  goal: Change the shipping address on order GW-48502 to 9 Harvard Square, Cambridge, Massachusetts 02138.
  stop_when: the agent confirms the shipping address was updated
  voice: aura-2-pandora-en
  pace: 1.0
  llm: {model: gpt-4.1-mini, temperature: 0.0, seed: 208}
  conditions: {noise: null, phone_line: true, packet_loss: 0.01, patience_s: 20}
  limits: {max_turns: 12, max_duration_s: 150, mutual_silence_reprompt_s: 4, mutual_silence_abort_s: 8}
fixtures: orders_basic
faults: []
expected:
  outcome: address_updated
  tool_calls:
    required:
      - {tool: lookup_order, args: {order_id: GW-48502, zip: "02139"}}
      - {tool: update_shipping_address, args: {order_id: GW-48502}}
    order: [lookup_order, update_shipping_address]
    forbidden: [issue_refund, escalate_to_human]
  final_state:
    - orders[GW-48502].shipping_address != "77 Massachusetts Ave, Cambridge, MA 02139"
