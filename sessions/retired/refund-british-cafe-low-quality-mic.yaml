title: Refund from a British caller in a cafe on a poor microphone
caller:
  persona: {name: Maria Lopez, style: calm, well-spoken, patient, accent: en-GB}
  facts: {order_id: GW-48213, zip: "94110", amount: 89.99, item: countertop blender}
  goal: >-
    Get a full refund of $89.99 for order GW-48213, which arrived broken.
  stop_when: >-
    the agent confirms the refund was issued
  voice: aura-2-pandora-en
  pace: 1.0
  llm: {model: gpt-4.1-mini, temperature: 0.0, seed: 404}
  conditions: {noise: "cafe@12dB", phone_line: false, packet_loss: 0.0, low_quality_mic: true, interruptions: 0.0, patience_s: 20}
  limits: {max_turns: 14, max_duration_s: 180, mutual_silence_reprompt_s: 4, mutual_silence_abort_s: 8}
fixtures: orders_basic
faults: []
expected:
  outcome: refunded
  tool_calls:
    required:
      - {tool: lookup_order, args: {order_id: GW-48213, zip: "94110"}}
      - {tool: issue_refund, args: {order_id: GW-48213, amount: 89.99}}
    order: [lookup_order, issue_refund]
    forbidden: [escalate_to_human, update_shipping_address]
  final_state:
    - refunds[GW-48213].amount == 89.99
  notes: >-
    Low-quality microphone (clipping and a high-pass) plus cafe babble. Compare WER with refund-noisy-cafe, which has the same noise on a phone line.
