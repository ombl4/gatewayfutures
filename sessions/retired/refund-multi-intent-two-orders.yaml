title: Refund on one order and a status question about another, in the same call
caller:
  persona: {name: Maria Lopez, style: organised, has two things on her list and says so up front, accent: en-US}
  facts: {order_id: GW-48213, zip: "94110", amount: 89.99, item: countertop blender, second_order_id: GW-48911, second_amount: 15.00, second_item: USB-C cable}
  goal: First, get a full refund of $89.99 for order GW-48213, which arrived broken. Once that is confirmed, ask whether the $15.00 refund on your other order, GW-48911, went through. Hang up once you have both answers.
  stop_when: the agent has confirmed the refund on GW-48213 and answered the question about GW-48911
  voice: aura-2-luna-en
  pace: 1.0
  llm: {model: gpt-4.1-mini, temperature: 0.0, seed: 305}
  conditions: {noise: null, phone_line: false, packet_loss: 0.0, interruptions: 0.0, patience_s: 20}
  limits: {max_turns: 16, max_duration_s: 200, mutual_silence_reprompt_s: 4, mutual_silence_abort_s: 8}
fixtures: orders_basic
faults: []
expected:
  outcome: refunded_and_second_order_explained
  tool_calls:
    required:
      - {tool: lookup_order, args: {order_id: GW-48213, zip: "94110"}}
      - {tool: issue_refund, args: {order_id: GW-48213, amount: 89.99}}
      - {tool: lookup_order, args: {order_id: GW-48911, zip: "94110"}}
    order: [lookup_order, issue_refund]
    forbidden: [update_shipping_address, escalate_to_human]
  final_state:
    - refunds[GW-48213].amount == 89.99
    - refunds[GW-48911] not exists
    - orders[GW-48911].refunded == true
  notes: Multi-intent. The second order was refunded before the call (fixture), so the right answer is a lookup and "that one was already refunded", never a second issue_refund. Tests whether the agent keeps two requests apart and verifies each order separately.
