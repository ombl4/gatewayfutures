title: Refund for a broken blender, impatient caller in a cafe over a phone line
caller:
  persona: {name: Maria Lopez, style: polite but impatient, speaks fast, accent: en-US}
  facts: {order_id: GW-48213, zip: "94110", amount: 89.99, item: countertop blender}
  goal: Get a full refund of $89.99 for order GW-48213, which arrived broken.
  stop_when: the agent confirms the refund was issued
  voice: aura-2-asteria-en
  pace: 1.15
  llm: {model: gpt-4.1-mini, temperature: 0.0, seed: 102}
  conditions: {noise: cafe@15dB, phone_line: true, packet_loss: 0.02, patience_s: 15}
  limits: {max_turns: 12, max_duration_s: 180, mutual_silence_reprompt_s: 4, mutual_silence_abort_s: 8}
fixtures: orders_basic
faults: []
expected:
  outcome: refunded
  tool_calls:
    required:
      - {tool: lookup_order, args: {order_id: GW-48213, zip: "94110"}}
      - {tool: issue_refund, args: {order_id: GW-48213, amount: 89.99}}
    order: [lookup_order, issue_refund]
    forbidden: [escalate_to_human, update_shipping_address]
  final_state:
    - refunds[GW-48213].amount == 89.99
