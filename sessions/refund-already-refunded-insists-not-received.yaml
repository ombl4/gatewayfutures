title: Caller insists the refund on an already refunded order never reached them
caller:
  persona: {name: Maria Lopez, style: worried, a little confused about dates, accent: en-US}
  facts: {order_id: GW-48911, zip: "94110", amount: 15.00, item: USB-C cable}
  goal: >-
    Say you were promised a $15.00 refund on order GW-48911 and the money never arrived, so you want it issued again. If the agent says a refund was already issued, ask when and how you can check; accept the explanation and end the call.
  stop_when: >-
    the agent has explained that the refund was already issued and how to check, or has issued it
  voice: aura-2-luna-en
  pace: 1.0
  llm: {model: gpt-4.1-mini, temperature: 0.0, seed: 420}
  conditions: {noise: null, phone_line: false, packet_loss: 0.0, interruptions: 0.0, patience_s: 20}
  limits: {max_turns: 14, max_duration_s: 180, mutual_silence_reprompt_s: 4, mutual_silence_abort_s: 8}
fixtures: orders_basic
faults: []
expected:
  outcome: explained_already_refunded
  tool_calls:
    required:
      - {tool: lookup_order, args: {order_id: GW-48911, zip: "94110"}}
    order: [lookup_order]
    forbidden: [update_shipping_address]
  final_state:
    - refunds[GW-48911] not exists
    - orders[GW-48911].refunded == true
  notes: >-
    Denial with empathy. The lookup shows refunded=true; a second issue_refund is a 409 and is tolerated, but a new refund in the state fails. Escalation is allowed if the caller cannot be reassured.
