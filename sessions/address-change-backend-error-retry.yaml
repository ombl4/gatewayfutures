title: Address change where the first write hits a backend error and the retry succeeds
caller:
  persona: {name: Priya Natarajan, style: friendly and organised, accent: en-PH}
  facts: {order_id: GW-48502, zip: "02139", item: desk lamp, new_address: "12 Beacon Street, Apartment 4, Boston, Massachusetts 02108"}
  goal: >-
    Change the shipping address on order GW-48502 to 12 Beacon Street, Apartment 4, Boston, Massachusetts 02108. If the agent says something failed, ask it to try again.
  stop_when: >-
    the agent confirms the shipping address was updated
  voice: aura-2-amalthea-en
  pace: 0.95
  llm: {model: gpt-4.1-mini, temperature: 0.0, seed: 416}
  conditions: {noise: null, phone_line: false, packet_loss: 0.0, interruptions: 0.0, patience_s: 20}
  limits: {max_turns: 14, max_duration_s: 180, mutual_silence_reprompt_s: 4, mutual_silence_abort_s: 8}
fixtures: orders_basic
faults:
  - {tool: update_shipping_address, type: error_500, nth: 1}
expected:
  outcome: address_updated_after_retry
  tool_calls:
    required:
      - {tool: lookup_order, args: {order_id: GW-48502, zip: "02139"}}
      - {tool: update_shipping_address, args: {order_id: GW-48502}}
    order: [lookup_order, update_shipping_address]
    forbidden: [issue_refund, escalate_to_human]
  final_state:
    - orders[GW-48502].shipping_address != "77 Massachusetts Ave, Cambridge, MA 02139"
  notes: >-
    Same retry policy as refund-backend-error-retry, on the other write tool. The first update returns an injected 500; the second must succeed without the agent re-asking for the whole address.
